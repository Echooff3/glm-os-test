<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iPhone OS</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: Helvetica, Arial, sans-serif;
    background: #1a1a2e;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

/* Desktop background */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 80%, #0a1628 0%, #000 100%);
    z-index: -1;
}

/* Phone frame */
#phone {
    width: 320px;
    height: 580px;
    background: #1a1a1a;
    border-radius: 40px;
    border: 3px solid #555;
    box-shadow: 0 0 0 2px #222, 0 0 40px rgba(0,0,0,.6), inset 0 0 0 2px #333;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Earpiece */
#phone::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 6px;
    background: #333;
    border-radius: 3px;
    z-index: 100;
}

/* Camera */
#phone::after {
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%) translateX(-40px);
    width: 8px;
    height: 8px;
    background: #1a2a3a;
    border-radius: 50%;
    border: 1px solid #333;
    z-index: 100;
}

/* Screen area */
#screen {
    margin: 32px 8px 8px 8px;
    flex: 1;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
}

/* Home button */
#home-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #555;
    background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
    margin: 4px auto 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
#home-btn:active { background: linear-gradient(180deg, #333, #222); }
#home-btn .sq {
    width: 14px; height: 14px;
    border: 1.5px solid #888;
    border-radius: 3px;
}

/* ===== STATUS BAR ===== */
#status-bar {
    height: 20px;
    background: linear-gradient(180deg, #4a6a9a 0%, #1a3a6a 50%, #0a2040 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
    z-index: 50;
}
#status-bar .left, #status-bar .right { display: flex; align-items: center; gap: 3px; }
.signal-bars { display: flex; align-items: flex-end; gap: 1px; height: 10px; }
.signal-bars .bar { width: 3px; background: #fff; border-radius: 0.5px; }
.signal-bars .bar:nth-child(1) { height: 3px; }
.signal-bars .bar:nth-child(2) { height: 5px; }
.signal-bars .bar:nth-child(3) { height: 7px; }
.signal-bars .bar:nth-child(4) { height: 9px; }
.signal-bars .bar:nth-child(5) { height: 10px; opacity: .3; }
.wifi-icon { font-size: 9px; }
.battery { display: flex; align-items: center; gap: 2px; font-size: 10px; }
.battery-icon {
    width: 18px; height: 9px;
    border: 1px solid #fff;
    border-radius: 2px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 1px;
}
.battery-icon::after {
    content: '';
    position: absolute;
    right: -3px;
    width: 2px; height: 4px;
    background: #fff;
    border-radius: 0 1px 1px 0;
}
.battery-fill { height: 100%; width: 75%; background: #4cd964; border-radius: 1px; }

/* ===== LOCK SCREEN ===== */
#lock-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #0a0e1a 0%, #0c1a2e 30%, #0a1628 60%, #000810 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 40;
    transition: transform .4s ease;
}
#lock-screen.unlocked { transform: translateY(-100%); }

#lock-time {
    font-size: 54px;
    font-weight: 100;
    color: #fff;
    margin-top: 60px;
    letter-spacing: 2px;
}
#lock-date {
    font-size: 14px;
    color: #ccc;
    margin-top: 4px;
}

/* Slide to unlock */
#slider-track {
    position: absolute;
    bottom: 40px;
    width: 260px;
    height: 40px;
    background: rgba(0,0,0,.5);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.15);
    overflow: hidden;
    display: flex;
    align-items: center;
}
#slider-thumb {
    width: 52px;
    height: 34px;
    background: linear-gradient(180deg, #ddd, #999);
    border-radius: 17px;
    margin-left: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    z-index: 2;
    touch-action: none;
}
#slider-thumb svg { width: 20px; height: 20px; }
#slider-text {
    position: absolute;
    width: 100%;
    text-align: center;
    font-size: 16px;
    color: rgba(255,255,255,.5);
    pointer-events: none;
    animation: slideShimmer 2s ease-in-out infinite;
}
@keyframes slideShimmer {
    0%, 100% { opacity: .3; }
    50% { opacity: .8; }
}

/* ===== HOME SCREEN ===== */
#home-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(ellipse at 50% 90%, #0a1e3a 0%, transparent 50%),
        radial-gradient(ellipse at 30% 70%, #0a1628 0%, transparent 40%),
        linear-gradient(180deg, #020810 0%, #081020 40%, #0a1830 70%, #040c18 100%);
    position: relative;
}
/* Starfield */
#home-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 80px 60px, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 150px 20px, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 200px 80px, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 50px 120px, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 250px 140px, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 120px 170px, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 180px 200px, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 40px 250px, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 220px 290px, rgba(255,255,255,.3), transparent),
        radial-gradient(2px 2px at 100px 100px, rgba(255,255,255,.2), transparent),
        radial-gradient(2px 2px at 270px 50px, rgba(255,255,255,.15), transparent);
    pointer-events: none;
}

/* App grid */
#app-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 8px;
    padding: 16px 12px 8px;
    align-content: start;
}

/* Page dots */
#page-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 4px 0;
    flex-shrink: 0;
}
.dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,.3);
}
.dot.active { background: #fff; }

/* ===== DOCK ===== */
#dock {
    display: flex;
    justify-content: space-around;
    padding: 6px 8px 8px;
    background: linear-gradient(180deg, rgba(100,120,140,.4) 0%, rgba(60,80,100,.6) 100%);
    border-top: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
}

/* ===== APP ICON ===== */
.app-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.app-icon:active .icon-img { transform: scale(.9); }

.icon-img {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    transition: transform .1s;
}
/* Glossy reflection */
.icon-img::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,.05) 100%);
    border-radius: 12px 12px 0 0;
    pointer-events: none;
}
.icon-img svg { width: 28px; height: 28px; z-index: 1; }

.icon-label {
    font-size: 10px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    text-align: center;
    max-width: 60px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Dock icons - no label */
#dock .icon-label { display: none; }
#dock .icon-img { width: 48px; height: 48px; }

/* Icon colors */
.ic-green { background: linear-gradient(180deg, #6ae06a, #2ea82e); }
.ic-blue { background: linear-gradient(180deg, #5ac8fa, #007aff); }
.ic-orange { background: linear-gradient(180deg, #ffb74d, #ff9500); }
.ic-red { background: linear-gradient(180deg, #ff6b6b, #ff3b30); }
.ic-purple { background: linear-gradient(180deg, #c39dff, #8e44ad); }
.ic-gray { background: linear-gradient(180deg, #b0b0b0, #8e8e93); }
.ic-yellow { background: linear-gradient(180deg, #fff176, #ffc107); }
.ic-teal { background: linear-gradient(180deg, #80deea, #009688); }
.ic-dkblue { background: linear-gradient(180deg, #5c7cfa, #2c3e8e); }
.ic-brown { background: linear-gradient(180deg, #a1887f, #6d4c41); }
.ic-white { background: linear-gradient(180deg, #f5f5f5, #ccc); }
.ic-dkgreen { background: linear-gradient(180deg, #66bb6a, #2e7d32); }
.ic-pink { background: linear-gradient(180deg, #f48fb1, #e91e63); }

/* ===== APP VIEW ===== */
#app-view {
    position: absolute;
    top: 20px; /* below status bar */
    left: 0; right: 0; bottom: 0;
    background: #ececec;
    z-index: 30;
    display: none;
    flex-direction: column;
    animation: appSlideIn .25s ease;
}
#app-view.visible { display: flex; }
@keyframes appSlideIn {
    from { opacity: 0; transform: scale(1.1); }
    to { opacity: 1; transform: scale(1); }
}

/* App title bar */
.app-titlebar {
    height: 44px;
    background: linear-gradient(180deg, #b0c4de 0%, #8faabe 50%, #7a98b2 100%);
    border-bottom: 1px solid #5a7a9a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
}
.app-titlebar h1 {
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 -1px 1px rgba(0,0,0,.3);
}
.app-back {
    position: absolute;
    left: 8px;
    background: linear-gradient(180deg, #8faabe, #6a8aaa);
    border: 1px solid #5a7a9a;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    text-shadow: 0 -1px 1px rgba(0,0,0,.3);
}
.app-back:active { background: #5a7a9a; }

.app-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* ===== CALCULATOR ===== */
.calc-container {
    background: #000;
    height: 100%;
    display: flex;
    flex-direction: column;
}
.calc-display {
    padding: 10px 16px;
    text-align: right;
    font-size: 36px;
    color: #fff;
    background: #333;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    word-break: break-all;
    overflow: hidden;
}
.calc-buttons {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: #333;
}
.calc-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    background: #555;
    cursor: pointer;
    border: none;
    padding: 0;
    min-height: 42px;
}
.calc-btn:active { background: #777; }
.calc-btn.op { background: #ff9500; }
.calc-btn.op:active { background: #cc7a00; }
.calc-btn.fn { background: #a0a0a0; color: #000; }
.calc-btn.fn:active { background: #ccc; }
.calc-btn.zero { grid-column: span 2; }

/* ===== NOTES ===== */
.notes-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #fffde7;
}
.notes-toolbar {
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    background: linear-gradient(180deg, #f5e6b8, #e8d5a0);
    border-bottom: 1px solid #c0a868;
}
.notes-toolbar button {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid #b09860;
    background: linear-gradient(180deg, #f5e6b8, #d8c490);
    font-size: 12px;
    cursor: pointer;
    color: #4a3a10;
}
.notes-toolbar button:active { background: #c0a868; }
.notes-textarea {
    flex: 1;
    border: none;
    outline: none;
    padding: 12px;
    font-size: 15px;
    font-family: 'Marker Felt', 'Comic Sans MS', cursive;
    background: repeating-linear-gradient(
        transparent, transparent 27px, #d4c098 27px, #d4c098 28px
    );
    background-color: #fffde7;
    line-height: 28px;
    resize: none;
    color: #1a1a1a;
}

/* ===== CLOCK ===== */
.clock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: #111;
    color: #fff;
}
.analog-clock {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 4px solid #ddd;
    position: relative;
    background: #222;
    box-shadow: 0 0 20px rgba(0,0,0,.5);
}
.clock-face { position: absolute; inset: 0; }
.clock-mark {
    position: absolute;
    width: 2px;
    height: 8px;
    background: #aaa;
    left: 50%;
    top: 8px;
    transform-origin: 50% 82px;
    margin-left: -1px;
}
.clock-mark.major { height: 12px; width: 3px; background: #fff; margin-left: -1.5px; }
.clock-hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: 50% 100%;
    border-radius: 2px;
}
.hand-hour { width: 4px; height: 45px; background: #fff; margin-left: -2px; }
.hand-minute { width: 3px; height: 60px; background: #fff; margin-left: -1.5px; }
.hand-second { width: 1px; height: 65px; background: #ff3b30; margin-left: -.5px; }
.clock-center {
    position: absolute;
    width: 8px; height: 8px;
    background: #ff3b30;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
}
.digital-time {
    font-size: 40px;
    font-weight: 200;
    margin-top: 20px;
    letter-spacing: 2px;
}
.digital-date { font-size: 14px; color: #999; margin-top: 6px; }

/* ===== WEATHER ===== */
.weather-container {
    height: 100%;
    background: linear-gradient(180deg, #4a90d9, #87ceeb);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
}
.weather-city { font-size: 22px; font-weight: 300; }
.weather-temp { font-size: 64px; font-weight: 100; margin: 10px 0; }
.weather-desc { font-size: 16px; opacity: .9; }
.weather-sun { margin: 20px 0; }
.weather-details {
    display: flex;
    gap: 30px;
    margin-top: 20px;
    font-size: 13px;
    opacity: .85;
}
.weather-details div { text-align: center; }
.weather-details .val { font-size: 18px; font-weight: 500; margin-top: 4px; }

/* ===== SETTINGS ===== */
.settings-container {
    height: 100%;
    background: #e8e8ed;
}
.settings-group {
    background: #fff;
    margin: 12px 10px;
    border-radius: 10px;
    overflow: hidden;
}
.settings-group-title {
    font-size: 12px;
    color: #6d6d72;
    text-transform: uppercase;
    padding: 8px 14px 4px;
}
.settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid #e8e8ed;
    font-size: 15px;
    cursor: pointer;
}
.settings-row:last-child { border-bottom: none; }
.settings-row .label { display: flex; align-items: center; gap: 10px; }
.settings-row .label .sicon {
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px;
}
.settings-row .arrow { color: #c7c7cc; font-size: 18px; }

/* Toggle switch */
.toggle {
    width: 44px; height: 26px;
    border-radius: 13px;
    background: #e8e8ed;
    position: relative;
    cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
}
.toggle.on { background: #4cd964; }
.toggle::after {
    content: '';
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    position: absolute;
    top: 2px; left: 2px;
    transition: transform .2s;
}
.toggle.on::after { transform: translateX(18px); }

/* ===== PHOTOS ===== */
.photos-container {
    height: 100%;
    background: #1a1a1a;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
    align-content: start;
}
.photo-thumb {
    aspect-ratio: 1;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: rgba(255,255,255,.5);
}

/* ===== CALENDAR ===== */
.calendar-container {
    height: 100%;
    background: #f5f5f5;
}
.cal-header {
    background: linear-gradient(180deg, #b0c4de, #7a98b2);
    padding: 10px;
    text-align: center;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 -1px 1px rgba(0,0,0,.3);
}
.cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    padding: 8px;
}
.cal-day-name {
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    color: #666;
    padding: 4px 0;
}
.cal-day {
    text-align: center;
    font-size: 14px;
    padding: 8px 4px;
    border-radius: 50%;
    width: 32px; height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2px auto;
}
.cal-day.today {
    background: #007aff;
    color: #fff;
    font-weight: bold;
}
.cal-day.empty { visibility: hidden; }

/* ===== MAPS ===== */
.maps-container {
    height: 100%;
    background: #e8dcc8;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
.maps-grid {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, rgba(180,160,130,.3) 1px, transparent 1px),
        linear-gradient(rgba(180,160,130,.3) 1px, transparent 1px);
    background-size: 40px 40px;
}
.maps-roads {
    position: absolute;
    inset: 0;
    overflow: hidden;
}
.maps-road {
    position: absolute;
    background: #f5e6b8;
    border: 1px solid #d4c098;
}
.maps-road.h { height: 14px; width: 100%; }
.maps-road.v { width: 14px; height: 100%; }
.maps-pin {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.maps-pin-head {
    width: 24px; height: 24px;
    background: #ff3b30;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #cc2a22;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.maps-pin-label {
    margin-top: 4px;
    font-size: 11px;
    color: #333;
    font-weight: bold;
    background: rgba(255,255,255,.8);
    padding: 2px 6px;
    border-radius: 4px;
}

/* ===== OS DEMOS ===== */
.demos-container {
    height: 100%;
    background: #e8e8ed;
}
.demo-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #fff;
    border-bottom: 1px solid #e8e8ed;
    cursor: pointer;
    text-decoration: none;
    color: #000;
    font-size: 15px;
}
.demo-link:active { background: #d0d0d5; }
.demo-link .dl-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
}
.demo-link .arrow { margin-left: auto; color: #c7c7cc; }

/* ===== RESPONSIVE ===== */
@media (max-width: 380px) {
    #phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
    }
    #phone::before, #phone::after { display: none; }
    #screen { margin: 0; border-radius: 0; }
    #home-btn { display: none; }
}

<script>
/* ===== CLOCK / STATUS BAR ===== */
function updateTime() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const timeStr = h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    document.getElementById('status-time').textContent = timeStr;

    const lockTime = document.getElementById('lock-time');
    if (lockTime) lockTime.textContent = h + ':' + String(m).padStart(2, '0');

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const lockDate = document.getElementById('lock-date');
    if (lockDate) lockDate.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
}
updateTime();
setInterval(updateTime, 1000);

/* Set calendar icon day */
const calIconDay = document.getElementById('cal-icon-day');
if (calIconDay) calIconDay.textContent = new Date().getDate();

/* ===== SLIDE TO UNLOCK ===== */
(function() {
    const thumb = document.getElementById('slider-thumb');
    const track = document.getElementById('slider-track');
    const lock = document.getElementById('lock-screen');
    let dragging = false, startX = 0, thumbX = 0;
    const maxX = 205;

    function start(e) {
        dragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX) - thumbX;
        e.preventDefault();
    }
    function move(e) {
        if (!dragging) return;
        const cx = (e.touches ? e.touches[0].clientX : e.clientX);
        let x = cx - startX;
        x = Math.max(0, Math.min(x, maxX));
        thumbX = x;
        thumb.style.transform = 'translateX(' + x + 'px)';
        if (x >= maxX - 10) unlock();
    }
    function end() {
        if (!dragging) return;
        dragging = false;
        if (thumbX < maxX - 10) {
            thumbX = 0;
            thumb.style.transform = 'translateX(0)';
            thumb.style.transition = 'transform .3s';
            setTimeout(function() { thumb.style.transition = ''; }, 300);
        }
    }
    function unlock() {
        dragging = false;
        lock.classList.add('unlocked');
    }

    thumb.addEventListener('mousedown', start);
    thumb.addEventListener('touchstart', start, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', end);
    window.addEventListener('touchend', end);
})();

/* ===== APP MANAGEMENT ===== */
let currentApp = null;

function openApp(name) {
    currentApp = name;
    const view = document.getElementById('app-view');
    const title = document.getElementById('app-title');
    const content = document.getElementById('app-content');
    view.classList.add('visible');
    content.innerHTML = '';

    switch (name) {
        case 'calculator': title.textContent = 'Calculator'; renderCalculator(content); break;
        case 'notes': title.textContent = 'Notes'; renderNotes(content); break;
        case 'clock': title.textContent = 'Clock'; renderClock(content); break;
        case 'weather': title.textContent = 'Weather'; renderWeather(content); break;
        case 'settings': title.textContent = 'Settings'; renderSettings(content); break;
        case 'photos': title.textContent = 'Photos'; renderPhotos(content); break;
        case 'calendar': title.textContent = 'Calendar'; renderCalendar(content); break;
        case 'maps': title.textContent = 'Maps'; renderMaps(content); break;
        case 'demos': title.textContent = 'OS Demos'; renderDemos(content); break;
    }
}

function closeApp() {
    currentApp = null;
    document.getElementById('app-view').classList.remove('visible');
    if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
}

function goHome() {
    const lock = document.getElementById('lock-screen');

}

/* ===== CALCULATOR ===== */
let calcDisplay = '0';

function calcInput(value) {
    const display = document.getElementById('calc-display');
    if (calcDisplay === '0' && value !== '.') {
        calcDisplay = value;
    } else {
        calcDisplay += value;
    }
    display.textContent = calcDisplay;
}

function calcClear() {
    calcDisplay = '0';
    document.getElementById('calc-display').textContent = '0';
}

function calcBackspace() {
    calcDisplay = calcDisplay.slice(0, -1) || '0';
    document.getElementById('calc-display').textContent = calcDisplay;
}

/* Safe arithmetic evaluator — no eval/Function */
function safeCalcEval(expr) {
    const tokens = [];
    let i = 0;
    while (i < expr.length) {
        if (expr[i] === ' ') { i++; continue; }
        if ('+-*/()'.indexOf(expr[i]) !== -1) {
            tokens.push(expr[i]); i++; continue;
        }
        let num = '';
        while (i < expr.length && (expr[i] >= '0' && expr[i] <= '9' || expr[i] === '.')) {
            num += expr[i]; i++;
        }
        if (i < expr.length && expr[i] === 'e') {
            num += expr[i]; i++;
            if (i < expr.length && (expr[i] === '+' || expr[i] === '-')) { num += expr[i]; i++; }
            while (i < expr.length && expr[i] >= '0' && expr[i] <= '9') { num += expr[i]; i++; }
        }
        if (num === '') throw new Error('Unexpected character');
        tokens.push(parseFloat(num));
    }
    /* Recursive descent: expr -> term ((+|-) term)* */
    let pos = 0;
    function parseExpr() {
        let left = parseTerm();
        while (pos < tokens.length && (tokens[pos] === '+' || tokens[pos] === '-')) {
            const op = tokens[pos++];
            const right = parseTerm();
            left = op === '+' ? left + right : left - right;
        }
        return left;
    }
    function parseTerm() {
        let left = parseFactor();
        while (pos < tokens.length && (tokens[pos] === '*' || tokens[pos] === '/')) {
            const op = tokens[pos++];
            const right = parseFactor();
            left = op === '*' ? left * right : left / right;
        }
        return left;
    }
    function parseFactor() {
        if (tokens[pos] === '(') {
            pos++;
            const val = parseExpr();
            if (tokens[pos] === ')') pos++;
            return val;
        }
        if (tokens[pos] === '-') { pos++; return -parseFactor(); }
        if (typeof tokens[pos] === 'number') return tokens[pos++];
        throw new Error('Unexpected token');
    }
    const result = parseExpr();
    if (pos < tokens.length) throw new Error('Unexpected token');
    return result;
}

function calcEquals() {
    const display = document.getElementById('calc-display');
    try {
        const expr = calcDisplay
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/−/g, '-')
            .replace(/%/g, '/100');
        const result = safeCalcEval(expr);
        calcDisplay = String(result);
        display.textContent = calcDisplay;
    } catch (e) {
        calcDisplay = 'Error';
        display.textContent = 'Error';
        setTimeout(function() { calcDisplay = '0'; display.textContent = '0'; }, 1500);
    }
}

function renderCalculator(container) {
    calcDisplay = '0';

                '<div class="calc-btn op" onclick="calcInput(\'÷\')">÷</div>' +
                '<div class="calc-btn" onclick="calcInput(\'7\')">7</div>' +
                '<div class="calc-btn" onclick="calcInput(\'8\')">8</div>' +
                '<div class="calc-btn" onclick="calcInput(\'9\')">9</div>' +

                '<div class="calc-btn op" onclick="calcInput(\'−\')">−</div>' +
                '<div class="calc-btn" onclick="calcInput(\'1\')">1</div>' +
                '<div class="calc-btn" onclick="calcInput(\'2\')">2</div>' +
                '<div class="calc-btn" onclick="calcInput(\'3\')">3</div>' +

/* ===== NOTES ===== */
function saveNotepad() {
    const textarea = document.getElementById('notes-textarea');
    const blob = new Blob([textarea.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'note.txt';
    a.click();
    URL.revokeObjectURL(url);
}

function clearNotepad() {
    if (confirm('Clear all content?')) {
        document.getElementById('notes-textarea').value = '';
    }
}

function copyNotepad() {
    const textarea = document.getElementById('notes-textarea');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).catch(() => {});
    } else {
        try { textarea.select(); document.execCommand('copy'); } catch (e) { /* ignore */ }
    }
}

function renderNotes(container) {
    container.innerHTML =
        '<div class="notes-container">' +
            '<div class="notes-toolbar">' +

                '<button onclick="copyNotepad()">Copy</button>' +
            '</div>' +
            '<textarea class="notes-textarea" id="notes-textarea" placeholder="Write your note here..."></textarea>' +
        '</div>';
}

/* ===== CLOCK ===== */
let clockInterval = null;

function renderClock(container) {
    let marks = '';
    for (let i = 0; i < 12; i++) {
        marks += '<div class="clock-mark major" style="transform:rotate(' + (i * 30) + 'deg)"></div>';
    }
    for (let j = 0; j < 60; j++) {
        if (j % 5 !== 0) marks += '<div class="clock-mark" style="transform:rotate(' + (j * 6) + 'deg)"></div>';
    }

    container.innerHTML =
        '<div class="clock-container">' +
            '<div class="analog-clock">' +
                '<div class="clock-face">' + marks + '</div>' +
                '<div class="clock-hand hand-hour" id="clock-hour"></div>' +
                '<div class="clock-hand hand-minute" id="clock-min"></div>' +
                '<div class="clock-hand hand-second" id="clock-sec"></div>' +
                '<div class="clock-center"></div>' +
            '</div>' +
            '<div class="digital-time" id="clock-digital">00:00:00</div>' +
            '<div class="digital-date" id="clock-date-display"></div>' +
        '</div>';

    function tick() {
        const now = new Date();
        const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
        const hDeg = h * 30 + m * 0.5;
        const mDeg = m * 6 + s * 0.1;
        const sDeg = s * 6;
        const hourEl = document.getElementById('clock-hour');
        const minEl = document.getElementById('clock-min');
        const secEl = document.getElementById('clock-sec');
        if (hourEl) hourEl.style.transform = 'rotate(' + hDeg + 'deg)';
        if (minEl) minEl.style.transform = 'rotate(' + mDeg + 'deg)';
        if (secEl) secEl.style.transform = 'rotate(' + sDeg + 'deg)';

        const dig = document.getElementById('clock-digital');
        if (dig) dig.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');

        const dd = document.getElementById('clock-date-display');
        if (dd) {
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            dd.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
        }
    }
    tick();
    if (clockInterval) clearInterval(clockInterval);
    clockInterval = setInterval(tick, 1000);
}

    if (el) el.classList.toggle('on', settingsState[key]);
}

/* ===== CALENDAR ===== */
function renderCalendar(container) {
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const first = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = now.getDate();

    let html = '<div class="calendar-container">' +
        '<div class="cal-header">' + months[month] + ' ' + year + '</div>' +
        '<div class="cal-grid">';
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (let d = 0; d < 7; d++) html += '<div class="cal-day-name">' + dayNames[d] + '</div>';
    for (let e = 0; e < first; e++) html += '<div class="cal-day empty"></div>';
    for (let i = 1; i <= daysInMonth; i++) {
        const cls = i === today ? 'cal-day today' : 'cal-day';
        html += '<div class="' + cls + '">' + i + '</div>';
    }
    html += '</div></div>';
    container.innerHTML = html;
}
