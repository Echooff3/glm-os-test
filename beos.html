<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeOS Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #a8a8a8;
        }

        /* Desktop */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #c0c0c0 0%, #a0a0a0 100%);
        }

        /* Desktop Icons */
        .desktop-icon {
            position: absolute;
            width: 80px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.1s;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .desktop-icon .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(180deg, #f5f5dc 0%, #d4d4aa 100%);
            border: 2px outset #c0c0c0;
            border-radius: 3px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .desktop-icon .label {
            color: #000;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 4px;
            border-radius: 2px;
            word-wrap: break-word;
        }

        /* OS Navigation Icons */
        .desktop-icon.os-link .icon {
            border: 3px outset #ffffff;
        }

        .desktop-icon.os-link.windows .icon {
            background: linear-gradient(180deg, #4a90d9 0%, #357abd 100%);
        }

        .desktop-icon.os-link.metro .icon {
            background: linear-gradient(180deg, #0078d4 0%, #005a9e 100%);
        }

        .desktop-icon.os-link.iphone .icon {
            background: linear-gradient(180deg, #1a1a1a 0%, #333 100%);
        }

        .desktop-icon.os-link:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        /* Window */
        .window {
            position: absolute;
            background: #d4d0c8;
            border-radius: 3px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.4);
            min-width: 300px;
            min-height: 200px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            border: 2px outset #ffffff;
        }

        .window.active {
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        /* BeOS Tab (Window Title) - on the left side */
        .window-tab {
            width: 28px;
            background: linear-gradient(180deg, #ffd700 0%, #e6c200 50%, #ccac00 100%);
            border-right: 2px inset #c0c0c0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5px;
            cursor: move;
            user-select: none;
            flex-shrink: 0;
        }

        .window-tab .tab-icon {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .window-tab .tab-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .window-tab .close-btn {
            width: 16px;
            height: 16px;
            background: #d4d0c8;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .window-tab .close-btn:active {
            border-style: inset;
        }

        .window-content {
            flex: 1;
            overflow: auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .window.minimized {
            display: none;
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
        }

        /* Resize handles */
        .resize-handle {
            position: absolute;
            background: transparent;
        }

        .resize-handle.n { top: 0; left: 10px; right: 10px; height: 5px; cursor: n-resize; }
        .resize-handle.s { bottom: 0; left: 10px; right: 10px; height: 5px; cursor: s-resize; }
        .resize-handle.e { right: 0; top: 10px; bottom: 10px; width: 5px; cursor: e-resize; }
        .resize-handle.w { left: 0; top: 10px; bottom: 10px; width: 5px; cursor: w-resize; }
        .resize-handle.nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nw-resize; }
        .resize-handle.ne { top: 0; right: 0; width: 10px; height: 10px; cursor: ne-resize; }
        .resize-handle.sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: sw-resize; }
        .resize-handle.se { bottom: 0; right: 0; width: 10px; height: 10px; cursor: se-resize; }

        /* Deskbar (Taskbar) - Top Right */
        #deskbar {
            position: fixed;
            top: 0;
            right: 0;
            background: linear-gradient(180deg, #d4d0c8 0%, #c0c0c0 100%);
            border: 2px outset #ffffff;
            display: flex;
            align-items: center;
            padding: 2px 5px;
            z-index: 9999;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        #be-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(180deg, #ffd700 0%, #e6c200 100%);
            border: 2px outset #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            margin-right: 5px;
        }

        #be-logo:active {
            border-style: inset;
        }

        #deskbar-apps {
            display: flex;
            gap: 2px;
        }

        .deskbar-item {
            padding: 4px 10px;
            background: #d4d0c8;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .deskbar-item:hover {
            background: #e0e0e0;
        }

        .deskbar-item:active {
            border-style: inset;
        }

        .deskbar-item.active {
            background: #ffd700;
        }

        #clock {
            color: #000;
            font-size: 11px;
            padding: 4px 10px;
            text-align: right;
            background: #d4d0c8;
            border: 2px outset #ffffff;
            margin-left: 5px;
        }

        /* Be Menu */
        #be-menu {
            position: fixed;
            top: 40px;
            right: 5px;
            width: 200px;
            background: #d4d0c8;
            border: 2px outset #ffffff;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.4);
            display: none;
            z-index: 10000;
            padding: 2px;
        }

        #be-menu.show {
            display: block;
        }

        .be-menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            color: #000;
            cursor: pointer;
            font-size: 12px;
        }

        .be-menu-item:hover {
            background: #ffd700;
        }

        .be-menu-item .icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .menu-separator {
            height: 1px;
            background: #808080;
            margin: 4px 0;
        }

        /* File Browser */
        .file-browser {
            display: flex;
            height: 100%;
        }

        .file-sidebar {
            width: 180px;
            background: #d4d0c8;
            border-right: 2px inset #c0c0c0;
            padding: 5px;
        }

        .file-sidebar h3 {
            font-size: 11px;
            color: #000;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .file-sidebar-item {
            padding: 6px 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }

        .file-sidebar-item:hover {
            background: #e0e0e0;
        }

        .file-sidebar-item.active {
            background: #ffd700;
            border: 1px solid #ccac00;
        }

        .file-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .file-toolbar {
            padding: 5px;
            background: #d4d0c8;
            border-bottom: 2px inset #c0c0c0;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .file-toolbar button {
            padding: 4px 10px;
            background: #d4d0c8;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 11px;
        }

        .file-toolbar button:hover {
            background: #e0e0e0;
        }

        .file-toolbar button:active {
            border-style: inset;
        }

        .file-toolbar input[type="file"] {
            display: none;
        }

        .file-list {
            flex: 1;
            padding: 5px;
            overflow-y: auto;
            background: #ffffff;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            cursor: pointer;
            font-size: 12px;
            user-select: none;
        }

        .file-item:hover {
            background: #e6e6e6;
        }

        .file-item .name {
            font-weight: normal;
        }

        .file-item .icon {
            font-size: 20px;
        }

        .file-item .info {
            flex: 1;
        }

        .file-item .size {
            font-size: 10px;
            color: #666;
        }

        .file-item .actions {
            display: flex;
            gap: 3px;
        }

        .file-item .actions button {
            padding: 2px 6px;
            font-size: 10px;
            background: #d4d0c8;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
        }

        /* Text Editor */
        .text-editor {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .editor-toolbar {
            padding: 5px;
            background: #d4d0c8;
            border-bottom: 2px inset #c0c0c0;
            display: flex;
            gap: 5px;
        }

        .editor-toolbar button {
            padding: 4px 10px;
            background: #d4d0c8;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 11px;
        }

        .editor-toolbar button:hover {
            background: #e0e0e0;
        }

        .editor-toolbar button:active {
            border-style: inset;
        }

        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .line-numbers {
            background: #d4d0c8;
            padding: 5px;
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #000;
            min-width: 40px;
            user-select: none;
            border-right: 2px inset #c0c0c0;
        }

        .editor-textarea {
            flex: 1;
            border: none;
            padding: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            line-height: 1.4;
            background: #ffffff;
        }

        /* Web Browser */
        .web-browser {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .browser-toolbar {
            padding: 5px;
            background: #d4d0c8;
            border-bottom: 2px inset #c0c0c0;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .browser-nav-btn {
            width: 28px;
            height: 24px;
            background: #d4d0c8;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 12px;
        }

        .browser-nav-btn:hover {
            background: #e0e0e0;
        }

        .browser-nav-btn:active {
            border-style: inset;
        }

        .browser-url {
            flex: 1;
            padding: 4px 8px;
            border: 2px inset #c0c0c0;
            font-size: 12px;
            background: #ffffff;
        }

        .browser-go {
            padding: 4px 12px;
            background: #d4d0c8;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 11px;
        }

        .browser-go:hover {
            background: #e0e0e0;
        }

        .browser-go:active {
            border-style: inset;
        }

        .browser-frame {
            flex: 1;
            border: none;
            background: white;
        }

        /* Calculator */
        .calculator {
            padding: 10px;
            background: #d4d0c8;
            height: 100%;
        }

        .calc-display {
            background: #ffffff;
            color: #000;
            padding: 10px;
            text-align: right;
            font-size: 24px;
            border: 2px inset #c0c0c0;
            margin-bottom: 10px;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .calc-btn {
            padding: 15px;
            font-size: 16px;
            border: 2px outset #ffffff;
            cursor: pointer;
            background: #d4d0c8;
            color: #000;
        }

        .calc-btn:hover {
            background: #e0e0e0;
        }

        .calc-btn:active {
            border-style: inset;
        }

        .calc-btn.operator {
            background: #c0c0c0;
        }

        .calc-btn.equals {
            background: #ffd700;
        }

        .calc-btn.clear {
            background: #ffcccc;
        }

        /* Paint */
        .paint-app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .paint-toolbar {
            padding: 5px;
            background: #d4d0c8;
            border-bottom: 2px inset #c0c0c0;
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        .paint-tool-btn {
            padding: 4px 8px;
            background: #d4d0c8;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 11px;
        }

        .paint-tool-btn.active {
            background: #ffd700;
            border-style: inset;
        }

        .paint-color-picker {
            width: 30px;
            height: 24px;
            border: 2px inset #c0c0c0;
            cursor: pointer;
        }

        .paint-size-slider {
            width: 80px;
        }

        .paint-canvas-container {
            flex: 1;
            overflow: auto;
            background: #808080;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #paint-canvas {
            background: white;
            cursor: crosshair;
        }

        /* Media Player */
        .media-player {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #d4d0c8;
        }

        .player-video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .player-controls {
            padding: 10px;
            background: #d4d0c8;
            border-top: 2px inset #c0c0c0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-progress {
            width: 100%;
            height: 8px;
            background: #ffffff;
            border: 2px inset #c0c0c0;
            cursor: pointer;
        }

        .player-progress-bar {
            height: 100%;
            background: #ffd700;
            width: 0%;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .player-btn {
            width: 32px;
            height: 28px;
            background: #d4d0c8;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 14px;
        }

        .player-btn:hover {
            background: #e0e0e0;
        }

        .player-btn:active {
            border-style: inset;
        }

        .player-btn.play {
            width: 40px;
            font-size: 16px;
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .player-volume input {
            width: 80px;
        }

        .player-file-input {
            display: none;
        }

        .player-load-btn {
            padding: 4px 10px;
            background: #ffd700;
            color: #000;
            border: 2px outset #ffffff;
            cursor: pointer;
            font-size: 11px;
        }

        .player-load-btn:hover {
            background: #e6c200;
        }

        .player-load-btn:active {
            border-style: inset;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: #d4d0c8;
            border: 2px outset #ffffff;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            z-index: 100000;
            display: none;
            min-width: 120px;
        }

        .context-menu.show {
            display: block;
        }

        .context-menu-item {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .context-menu-item:hover {
            background: #ffd700;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 16px;
            height: 16px;
        }

        ::-webkit-scrollbar-track {
            background: #d4d0c8;
        }

        ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border: 2px outset #ffffff;
        }

        ::-webkit-scrollbar-button {
            background: #d4d0c8;
            border: 2px outset #ffffff;
        }
    </style>
</head>
<body>
    <div id="desktop"></div>
    
    <div id="deskbar">
        <div id="be-logo">Be</div>
        <div id="deskbar-apps"></div>
        <div id="clock"></div>
    </div>
    
    <div id="be-menu">
        <div class="be-menu-item" data-app="file-browser">
            <div class="icon">📁</div>
            <span>File Browser</span>
        </div>
        <div class="be-menu-item" data-app="text-editor">
            <div class="icon">📝</div>
            <span>Text Editor</span>
        </div>
        <div class="be-menu-item" data-app="web-browser">
            <div class="icon">🌐</div>
            <span>Web Browser</span>
        </div>
        <div class="menu-separator"></div>
        <div class="be-menu-item" data-app="calculator">
            <div class="icon">🧮</div>
            <span>Calculator</span>
        </div>
        <div class="be-menu-item" data-app="paint">
            <div class="icon">🎨</div>
            <span>Paint</span>
        </div>
        <div class="be-menu-item" data-app="media-player">
            <div class="icon">🎵</div>
            <span>Media Player</span>
        </div>
    </div>
    
    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" data-action="refresh">Refresh</div>
    </div>

    <script>
        // ==================== CONSTANTS ====================
        const APPS = {
            'file-browser': {
                name: 'File Browser',
                icon: '📁',
                width: 700,
                height: 500,
                template: 'file-browser-template'
            },
            'text-editor': {
                name: 'Text Editor',
                icon: '📝',
                width: 600,
                height: 450,
                template: 'text-editor-template'
            },
            'web-browser': {
                name: 'Web Browser',
                icon: '🌐',
                width: 800,
                height: 600,
                template: 'web-browser-template'
            },
            'calculator': {
                name: 'Calculator',
                icon: '🧮',
                width: 280,
                height: 380,
                template: 'calculator-template'
            },
            'paint': {
                name: 'Paint',
                icon: '🎨',
                width: 700,
                height: 550,
                template: 'paint-template'
            },
            'media-player': {
                name: 'Media Player',
                icon: '🎵',
                width: 600,
                height: 450,
                template: 'media-player-template'
            }
        };

        // ==================== FILE SYSTEM ====================
        class FileSystem {
            constructor() {
                this.dbName = 'BeOSFileSystem';
                this.dbVersion = 1;
                this.db = null;
                this.init();
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        
                        if (!db.objectStoreNames.contains('files')) {
                            const fileStore = db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
                            fileStore.createIndex('name', 'name', { unique: false });
                            fileStore.createIndex('parentId', 'parentId', { unique: false });
                        }

                        if (!db.objectStoreNames.contains('folders')) {
                            const folderStore = db.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
                            folderStore.createIndex('name', 'name', { unique: false });
                            folderStore.createIndex('parentId', 'parentId', { unique: false });
                        }
                    };
                });
            }

            async saveFile(fileData) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.add({
                        name: fileData.name,
                        content: fileData.content,
                        type: fileData.type,
                        size: fileData.size,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async getFiles() {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['files'], 'readonly');
                    const store = transaction.objectStore('files');
                    const request = store.getAll();

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async deleteFile(id) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.delete(id);

                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async getFile(id) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['files'], 'readonly');
                    const store = transaction.objectStore('files');
                    const request = store.get(id);

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            saveSession(key, data) {
                localStorage.setItem(`beos_${key}`, JSON.stringify(data));
            }

            getSession(key) {
                const data = localStorage.getItem(`beos_${key}`);
                return data ? JSON.parse(data) : null;
            }
        }

        const fileSystem = new FileSystem();

        // ==================== WINDOW MANAGER ====================
        class WindowManager {
            constructor() {

                                    <canvas id="paint-canvas" width="600" height="400"></canvas>

                    case 'media-player':
                        return `
                            <div class="media-player">
                                <div class="player-video-container">
                                    <video id="media-video" style="max-width:100%; max-height:100%; display:none;"></video>

                                    <div id="media-placeholder" style="color:#fff; text-align:center;">
                                        <div style="font-size:64px; margin-bottom:20px;">🎵</div>
                                        <div>Load a media file to play</div>

                                <div class="player-controls">
                                    <div class="player-progress" id="player-progress" onclick="seekMedia(event)">

                                        <button class="player-btn" onclick="mediaSeek(-10)">⏪</button>
                                        <button class="player-btn play" onclick="toggleMediaPlay()">▶️</button>

                                        <button class="player-btn" onclick="stopMedia()">⏹️</button>

                                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                                        <div class="player-volume">

                        return '<div>App not found</div>';

            initializeAppLogic(appId, windowEl) {
                switch (appId) {
                    case 'file-browser':
                        this.initFileBrowser(windowEl);
                        break;
                    case 'paint':
                        this.initPaint(windowEl);
                        break;
                    case 'media-player':
                        this.initMediaPlayer(windowEl);
                        break;
                }
            }

            initFileBrowser(windowEl) {
                windowEl.currentFilter = 'all';
                
                const sidebarItems = windowEl.querySelectorAll('.file-sidebar-item');
                sidebarItems.forEach(item => {
                    item.addEventListener('click', () => {
                        sidebarItems.forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        windowEl.currentFilter = item.dataset.filter;
                        this.loadFiles(windowEl);
                    });
                });
                
                this.loadFiles(windowEl);
            }

            async loadFiles(windowEl) {
                const fileList = windowEl.querySelector('#file-list');
                if (!fileList) return;

                try {
                    let files = await fileSystem.getFiles();
                    
                    const filter = windowEl.currentFilter || 'all';
                    if (filter !== 'all') {
                        files = files.filter(file => {
                            switch (filter) {
                                case 'documents':
                                    return file.type.startsWith('text/') ||
                                           file.type.includes('javascript') ||
                                           file.type.includes('json') ||
                                           file.type.includes('html') ||
                                           file.type.includes('css') ||
                                           file.type.includes('xml') ||
                                           file.name.match(/\.(txt|md|js|html|css|json|xml|py|java|c|cpp|h|ts|tsx|jsx|pdf|doc|docx|xls|xlsx|ppt|pptx)$/);
                                case 'images':
                                    return file.type.startsWith('image/');
                                case 'audio':
                                    return file.type.startsWith('audio/');
                                case 'videos':
                                    return file.type.startsWith('video/');
                                default:
                                    return true;
                            }
                        });
                    }
                    
                    if (files.length === 0) {
                        const filterMessages = {
                            'all': 'No files yet. Upload some files!',
                            'documents': 'No documents found.',
                            'images': 'No images found.',
                            'audio': 'No audio files found.',
                            'videos': 'No videos found.'
                        };
                        fileList.innerHTML = `
                            <div style="text-align:center; padding:40px; color:#666;">
                                <div style="font-size:48px; margin-bottom:10px;">📁</div>
                                <div>${filterMessages[filter] || 'No files found.'}</div>
                            </div>
                        `;
                        return;
                    }

                    fileList.innerHTML = files.map(file => `
                        <div class="file-item" ondblclick="openFileInApp(${file.id})">
                            <div class="icon">${this.getFileIcon(file.type)}</div>
                            <div class="info">
                                <div class="name">${file.name}</div>
                                <div class="size">${this.formatFileSize(file.size)}</div>
                            </div>
                            <div class="actions">
                                <button onclick="event.stopPropagation(); downloadFile(${file.id})">⬇️</button>
                                <button onclick="event.stopPropagation(); deleteFile(${file.id}, this)">🗑️</button>
                            </div>
                        </div>
                    `).join('');
                } catch (error) {
                    fileList.innerHTML = `<div style="padding:20px; color:#c00;">Error loading files: ${error.message}</div>`;
                }
            }

            getFileIcon(type) {
                if (type.startsWith('image/')) return '🖼️';
                if (type.startsWith('audio/')) return '🎵';
                if (type.startsWith('video/')) return '🎬';
                if (type.includes('pdf')) return '📄';
                if (type.includes('text') || type.includes('json') || type.includes('javascript') || type.includes('html') || type.includes('css')) return '📝';
                return '📎';
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            initPaint(windowEl) {
                const canvas = windowEl.querySelector('#paint-canvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;
                let startX = 0;
                let startY = 0;
                let currentTool = 'brush';
                let savedImageData = null;

                const getMousePos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    return {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    };
                };

                canvas.addEventListener('mousedown', (e) => {
                    isDrawing = true;
                    const pos = getMousePos(e);
                    lastX = pos.x;
                    lastY = pos.y;
                    startX = pos.x;
                    startY = pos.y;
                    currentTool = windowEl.querySelector('.paint-tool-btn.active')?.dataset.tool || 'brush';
                    
                    if (currentTool === 'line' || currentTool === 'rect' || currentTool === 'circle') {
                        savedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    }
                });

                canvas.addEventListener('mousemove', (e) => {
                    if (!isDrawing) return;
                    
                    const pos = getMousePos(e);
                    const color = windowEl.querySelector('#paint-color').value;
                    const size = windowEl.querySelector('#paint-size').value;

                    ctx.strokeStyle = color;
                    ctx.fillStyle = color;
                    ctx.lineWidth = size;
                    ctx.lineCap = 'round';

                    if (currentTool === 'brush') {
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(pos.x, pos.y);
                        ctx.stroke();
                        lastX = pos.x;
                        lastY = pos.y;
                    } else if (currentTool === 'eraser') {
                        ctx.strokeStyle = 'white';
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(pos.x, pos.y);
                        ctx.stroke();
                        lastX = pos.x;
                        lastY = pos.y;
                    } else if (currentTool === 'line') {
                        ctx.putImageData(savedImageData, 0, 0);
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(pos.x, pos.y);
                        ctx.stroke();
                    } else if (currentTool === 'rect') {
                        ctx.putImageData(savedImageData, 0, 0);
                        ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
                    } else if (currentTool === 'circle') {
                        ctx.putImageData(savedImageData, 0, 0);
                        const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                        ctx.beginPath();
                        ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                });

                canvas.addEventListener('mouseup', () => {
                    isDrawing = false;
                });

                canvas.addEventListener('mouseleave', () => {
                    isDrawing = false;
                });
            }

            initMediaPlayer(windowEl) {
                const video = windowEl.querySelector('#media-video');
                const audio = windowEl.querySelector('#media-audio');
                const progressBar = windowEl.querySelector('#player-progress-bar');
                const timeDisplay = windowEl.querySelector('#media-time');

                const updateTime = () => {
                    const media = video.style.display !== 'none' ? video : audio;
                    if (media.duration) {
                        const percent = (media.currentTime / media.duration) * 100;
                        progressBar.style.width = percent + '%';
                        timeDisplay.textContent = `${this.formatTime(media.currentTime)} / ${this.formatTime(media.duration)}`;
                    }
                };

                video.addEventListener('timeupdate', updateTime);
                audio.addEventListener('timeupdate', updateTime);
                video.addEventListener('ended', () => windowEl.querySelector('.play').textContent = '▶️');
                audio.addEventListener('ended', () => windowEl.querySelector('.play').textContent = '▶️');

                windowEl.mediaUpdate = updateTime;
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            setActiveWindow(windowId) {
                this.windows.forEach(w => {
                    w.element.classList.remove('active');
                });
                const window = this.windows.find(w => w.id === windowId);
                if (window) {
                    window.element.classList.add('active');
                    window.element.style.zIndex = ++this.zIndex;
                    this.activeWindow = window;
                    deskbar.updateActiveTask(windowId);
                }
            }

            minimizeWindow(windowId) {
                const window = this.windows.find(w => w.id === windowId);
                if (window) {
                    window.minimized = true;
                    window.element.classList.add('minimized');
                    deskbar.updateTaskState(windowId, 'minimized');
                }
            }

            maximizeWindow(windowId) {
                const window = this.windows.find(w => w.id === windowId);
                if (window) {
                    window.maximized = !window.maximized;
                    window.element.classList.toggle('maximized');
                }
            }

            restoreWindow(windowId) {
                const window = this.windows.find(w => w.id === windowId);
                if (window) {
                    window.minimized = false;
                    window.element.classList.remove('minimized');
                    this.setActiveWindow(windowId);
                    deskbar.updateTaskState(windowId, 'active');
                }
            }

            closeWindow(windowId) {
                const index = this.windows.findIndex(w => w.id === windowId);
                if (index !== -1) {
                    this.windows[index].element.remove();
                    this.windows.splice(index, 1);
                    deskbar.removeTask(windowId);
                }
            }

            setupEventListeners() {
                document.getElementById('desktop').addEventListener('mousedown', (e) => {
                    if (e.target.id === 'desktop') {
                        this.closeBeMenu();
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.dragState) {
                        const dx = e.clientX - this.dragState.startX;
                        const dy = e.clientY - this.dragState.startY;
                        const window = this.dragState.window.element;
                        window.style.left = (this.dragState.startLeft + dx) + 'px';
                        window.style.top = (this.dragState.startTop + dy) + 'px';
                    }
                    if (this.resizeState) {
                        const dx = e.clientX - this.resizeState.startX;
                        const dy = e.clientY - this.resizeState.startY;
                        const window = this.resizeState.window.element;
                        const style = getComputedStyle(window);
                        const startWidth = this.resizeState.startWidth;
                        const startHeight = this.resizeState.startHeight;
                        const startLeft = this.resizeState.startLeft;
                        const startTop = this.resizeState.startTop;

                        if (this.resizeState.direction.includes('e')) {
                            window.style.width = Math.max(300, startWidth + dx) + 'px';
                        }
                        if (this.resizeState.direction.includes('w')) {
                            const newWidth = Math.max(300, startWidth - dx);
                            window.style.width = newWidth + 'px';
                            window.style.left = (startLeft + startWidth - newWidth) + 'px';
                        }
                        if (this.resizeState.direction.includes('s')) {
                            window.style.height = Math.max(200, startHeight + dy) + 'px';
                        }
                        if (this.resizeState.direction.includes('n')) {
                            const newHeight = Math.max(200, startHeight - dy);
                            window.style.height = newHeight + 'px';
                            window.style.top = (startTop + startHeight - newHeight) + 'px';
                        }
                    }
                });

                document.addEventListener('mouseup', () => {
                    this.dragState = null;
                    this.resizeState = null;
                });

                document.addEventListener('mousedown', (e) => {
                    const windowEl = e.target.closest('.window');
                    if (windowEl) {
                        const windowId = windowEl.id;
                        this.setActiveWindow(windowId);

                        const tab = e.target.closest('.window-tab');
                        if (tab && !e.target.closest('.close-btn')) {
                            const window = this.windows.find(w => w.id === windowId);
                            if (window && !window.maximized) {
                                this.dragState = {
                                    window: window,
                                    startX: e.clientX,
                                    startY: e.clientY,
                                    startLeft: parseInt(windowEl.style.left),
                                    startTop: parseInt(windowEl.style.top)
                                };
                            }
                        }

                        const resizeHandle = e.target.closest('.resize-handle');
                        if (resizeHandle) {
                            const window = this.windows.find(w => w.id === windowId);
                            if (window && !window.maximized) {
                                this.resizeState = {
                                    window: window,
                                    direction: resizeHandle.classList[1],
                                    startX: e.clientX,
                                    startY: e.clientY,
                                    startWidth: parseInt(getComputedStyle(windowEl).width),
                                    startHeight: parseInt(getComputedStyle(windowEl).height),
                                    startLeft: parseInt(windowEl.style.left),
                                    startTop: parseInt(windowEl.style.top)
                                };
                            }
                        }

                        const closeBtn = e.target.closest('.close-btn');
                        if (closeBtn) {
                            this.closeWindow(windowId);
                        }
                    }
                });
            }

            closeBeMenu() {
                document.getElementById('be-menu').classList.remove('show');
            }
        }

        // ==================== DESKBAR ====================
        class Deskbar {
            constructor() {
                this.tasks = new Map();
                this.setupEventListeners();
            }

            addTask(windowId, appId) {
                const app = APPS[appId];
                const taskEl = document.createElement('button');
                taskEl.className = 'deskbar-item active';
                taskEl.dataset.windowId = windowId;
                taskEl.innerHTML = `<span>${app.icon}</span> ${app.name}`;
                
                taskEl.addEventListener('click', () => {
                    const window = windowManager.windows.find(w => w.id === windowId);
                    if (window) {
                        if (window.minimized) {
                            windowManager.restoreWindow(windowId);
                        } else if (windowManager.activeWindow?.id === windowId) {
                            windowManager.minimizeWindow(windowId);
                        } else {
                            windowManager.setActiveWindow(windowId);
                        }
                    }
                });

                document.getElementById('deskbar-apps').appendChild(taskEl);
                this.tasks.set(windowId, taskEl);
            }

            removeTask(windowId) {
                const taskEl = this.tasks.get(windowId);
                if (taskEl) {
                    taskEl.remove();
                    this.tasks.delete(windowId);
                }
            }

            updateActiveTask(windowId) {
                this.tasks.forEach((taskEl, id) => {
                    taskEl.classList.toggle('active', id === windowId);
                });
            }

            updateTaskState(windowId, state) {
                const taskEl = this.tasks.get(windowId);
                if (taskEl) {
                    taskEl.classList.toggle('active', state === 'active');
                }
            }

            setupEventListeners() {
                document.getElementById('be-logo').addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.getElementById('be-menu').classList.toggle('show');
                });

                document.querySelectorAll('.be-menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const appId = item.dataset.app;
                        const windowData = windowManager.createWindow(appId);
                        if (windowData) {
                            this.addTask(windowData.id, appId);
                        }
                        windowManager.closeBeMenu();
                    });
                });
            }
        }

        // ==================== DESKTOP ====================
        class Desktop {
            constructor() {
                this.setupDesktopIcons();
                this.setupContextMenu();
            }

            setupDesktopIcons() {
                const desktop = document.getElementById('desktop');
                const iconPositions = [
                    { app: 'file-browser', x: 20, y: 20 },
                    { app: 'text-editor', x: 20, y: 120 },
                    { app: 'web-browser', x: 20, y: 220 },
                    { app: 'calculator', x: 20, y: 320 },
                    { app: 'paint', x: 20, y: 420 },
                    { app: 'media-player', x: 20, y: 520 }
                ];

                iconPositions.forEach(pos => {
                    const app = APPS[pos.app];
                    const iconEl = document.createElement('div');
                    iconEl.className = 'desktop-icon';
                    iconEl.style.left = pos.x + 'px';
                    iconEl.style.top = pos.y + 'px';
                    iconEl.innerHTML = `
                        <div class="icon">${app.icon}</div>
                        <div class="label">${app.name}</div>
                    `;
                    iconEl.addEventListener('click', () => {
                        const windowData = windowManager.createWindow(pos.app);
                        if (windowData) {
                            deskbar.addTask(windowData.id, pos.app);
                        }
                    });
                    desktop.appendChild(iconEl);
                });

                this.addOSNavigationIcons(desktop);
            }

                const osLinks = [

                    },
                    {

                        y: 120
                    },
                    {

                    },
                    {

                        className: 'android',

            setupContextMenu() {
                const contextMenu = document.getElementById('context-menu');
                
                document.getElementById('desktop').addEventListener('contextmenu', (e) => {
                    if (e.target.id === 'desktop') {
                        e.preventDefault();
                        contextMenu.style.left = e.clientX + 'px';
                        contextMenu.style.top = e.clientY + 'px';
                        contextMenu.classList.add('show');
                    }
                });

                document.addEventListener('click', () => {
                    contextMenu.classList.remove('show');
                });

                contextMenu.querySelectorAll('.context-menu-item').forEach(item => {

        // ==================== GLOBAL FUNCTIONS ====================
        
        // File Browser Functions
        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    await fileSystem.saveFile({
                        name: file.name,
                        content: e.target.result,
                        type: file.type,
                        size: file.size
                    });
                    
                    const status = input.parentElement.querySelector('#file-status');
                    status.textContent = '✓ File uploaded!';
                    setTimeout(() => status.textContent = '', 2000);
                    
                    const windowEl = input.closest('.window');
                    windowManager.loadFiles(windowEl);
                } catch (error) {
                    alert('Error saving file: ' + error.message);
                }
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        async function downloadFile(id) {
            try {
                const file = await fileSystem.getFile(id);
                const link = document.createElement('a');
                link.href = file.content;
                link.download = file.name;
                link.click();
            } catch (error) {
                alert('Error downloading file: ' + error.message);
            }
        }

        async function deleteFile(id, btn) {
            if (!confirm('Are you sure you want to delete this file?')) return;
            
            try {
                await fileSystem.deleteFile(id);
                const fileItem = btn.closest('.file-item');
                fileItem.remove();
            } catch (error) {
                alert('Error deleting file: ' + error.message);
            }
        }

        async function openFileInApp(fileId) {
            try {
                const file = await fileSystem.getFile(fileId);
                if (!file) {
                    alert('File not found');
                    return;
                }

                let appId = null;
                
                if (file.type.startsWith('audio/') || file.type.startsWith('video/')) {
                    appId = 'media-player';
                } else if (file.type.startsWith('text/') ||
                           file.type.includes('javascript') ||
                           file.type.includes('json') ||
                           file.type.includes('html') ||
                           file.type.includes('css') ||
                           file.type.includes('xml') ||
                           file.name.match(/\.(txt|md|js|html|css|json|xml|py|java|c|cpp|h|ts|tsx|jsx)$/)) {
                    appId = 'text-editor';
                } else if (file.type.startsWith('image/')) {
                    appId = 'paint';
                } else {
                    alert('No application available for this file type');
                    return;
                }

                let existingWindow = windowManager.windows.find(w => w.appId === appId);
                
                if (existingWindow) {
                    if (existingWindow.minimized) {
                        windowManager.restoreWindow(existingWindow.id);
                    } else {
                        windowManager.setActiveWindow(existingWindow.id);
                    }
                } else {
                    const windowData = windowManager.createWindow(appId);
                    if (windowData) {
                        deskbar.addTask(windowData.id, appId);
                        existingWindow = windowData;
                    }
                }

                const windowEl = existingWindow.element;
                
                if (appId === 'media-player') {
                    const video = windowEl.querySelector('#media-video');
                    const audio = windowEl.querySelector('#media-audio');
                    const placeholder = windowEl.querySelector('#media-placeholder');
                    
                    const dataUrl = file.content;
                    
                    if (file.type.startsWith('video/')) {
                        video.src = dataUrl;
                        video.style.display = 'block';
                        audio.style.display = 'none';
                        placeholder.style.display = 'none';
                        currentMedia = video;
                    } else {
                        audio.src = dataUrl;
                        audio.style.display = 'block';
                        video.style.display = 'none';
                        placeholder.style.display = 'none';
                        currentMedia = audio;
                    }
                    
                    const playBtn = windowEl.querySelector('.play');
                    playBtn.textContent = '▶️';
                } else if (appId === 'text-editor') {
                    const textarea = windowEl.querySelector('.editor-textarea');
                    
                    let content = '';
                    if (file.content.startsWith('data:')) {
                        const base64Part = file.content.split(',')[1];
                        try {
                            content = decodeURIComponent(escape(atob(base64Part)));
                        } catch (e) {
                            content = base64Part;
                        }
                    } else {
                        content = file.content;
                    }
                    
                    textarea.value = content;
                    updateLineNumbers(textarea);
                } else if (appId === 'paint') {
                    const canvas = windowEl.querySelector('#paint-canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const img = new Image();
                    img.onload = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = file.content;
                }
                
            } catch (error) {
                alert('Error opening file: ' + error.message);
            }
        }

        // Text Editor Functions
        function updateLineNumbers(textarea) {
            const lines = textarea.value.split('\n').length;
            const lineNumbers = textarea.previousElementSibling;
            lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
        }

        async function saveEditorFile(btn) {
            const windowEl = btn.closest('.window');
            const textarea = windowEl.querySelector('.editor-textarea');
            const content = textarea.value;
            
            const name = prompt('Enter file name:', 'untitled.txt');
            if (!name) return;

            let type = 'text/plain';
            if (name.endsWith('.js')) type = 'application/javascript';
            else if (name.endsWith('.html')) type = 'text/html';
            else if (name.endsWith('.css')) type = 'text/css';
            else if (name.endsWith('.json')) type = 'application/json';

            try {
                await fileSystem.saveFile({
                    name: name,
                    content: 'data:' + type + ';base64,' + btoa(unescape(encodeURIComponent(content))),
                    type: type,
                    size: content.length
                });
                alert('File saved successfully!');
            } catch (error) {
                alert('Error saving file: ' + error.message);
            }
        }

        function loadEditorFile(btn) {
            const input = btn.nextElementSibling;
            input.click();
        }

        function loadFileIntoEditor(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const windowEl = input.closest('.window');
                const textarea = windowEl.querySelector('.editor-textarea');
                textarea.value = e.target.result;
                updateLineNumbers(textarea);
            };
            reader.readAsText(file);
            input.value = '';
        }

        function clearEditor(btn) {
            const windowEl = btn.closest('.window');
            const textarea = windowEl.querySelector('.editor-textarea');
            if (confirm('Clear all content?')) {
                textarea.value = '';
                updateLineNumbers(textarea);
            }
        }

        // Web Browser Functions
        function browserNavigate(input) {
            const windowEl = input.closest('.window');
            const iframe = windowEl.querySelector('iframe');
            let url = input.value.trim();
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            iframe.src = url;
            input.value = url;
        }

        function browserBack(btn) {
            const windowEl = btn.closest('.window');
            const iframe = windowEl.querySelector('iframe');
            iframe.contentWindow.history.back();
        }

        function browserForward(btn) {
            const windowEl = btn.closest('.window');
            const iframe = windowEl.querySelector('iframe');
            iframe.contentWindow.history.forward();
        }

        function browserRefresh(btn) {
            const windowEl = btn.closest('.window');
            const iframe = windowEl.querySelector('iframe');
            iframe.src = iframe.src;
        }

        // Calculator Functions
        let calcExpression = '';
        let calcDisplay = '0';

        function calcInput(value) {
            const display = document.querySelector('.window.active .calc-display') || document.querySelector('.calc-display');
            if (!display) return;

            if (calcDisplay === '0' && value !== '.') {
                calcDisplay = value;
            } else {
                calcDisplay += value;
            }
            display.textContent = calcDisplay;
        }

        function calcClear() {
            calcExpression = '';
            calcDisplay = '0';
            const display = document.querySelector('.window.active .calc-display') || document.querySelector('.calc-display');
            if (display) display.textContent = '0';
        }

        function calcBackspace() {
            calcDisplay = calcDisplay.slice(0, -1) || '0';
            const display = document.querySelector('.window.active .calc-display') || document.querySelector('.calc-display');
            if (display) display.textContent = calcDisplay;
        }

        function calcEquals() {
            try {
                const result = eval(calcDisplay.replace(/×/g, '*').replace(/÷/g, '/'));
                calcDisplay = String(result);
                const display = document.querySelector('.window.active .calc-display') || document.querySelector('.calc-display');
                if (display) display.textContent = calcDisplay;
            } catch (e) {
                calcDisplay = 'Error';
                const display = document.querySelector('.window.active .calc-display') || document.querySelector('.calc-display');
                if (display) display.textContent = 'Error';
                setTimeout(() => {
                    calcDisplay = '0';
                    if (display) display.textContent = '0';
                }, 1500);
            }
        }

        // Paint Functions
        function setPaintTool(btn, tool) {
            const windowEl = btn.closest('.window');
            windowEl.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function clearPaintCanvas() {
            const canvas = document.querySelector('.window.active #paint-canvas') || document.querySelector('#paint-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function savePaintCanvas() {
            const canvas = document.querySelector('.window.active #paint-canvas') || document.querySelector('#paint-canvas');
            if (!canvas) return;

            const link = document.createElement('a');
            link.download = 'painting.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Media Player Functions
        let currentMedia = null;

        function loadMediaFile(input) {
            const file = input.files[0];
            if (!file) return;

            const windowEl = input.closest('.window');
            const video = windowEl.querySelector('#media-video');
            const audio = windowEl.querySelector('#media-audio');
            const placeholder = windowEl.querySelector('#media-placeholder');

            const url = URL.createObjectURL(file);

            if (file.type.startsWith('video/')) {
                video.src = url;
                video.style.display = 'block';
                audio.style.display = 'none';
                placeholder.style.display = 'none';
                currentMedia = video;
            } else {
                audio.src = url;
                audio.style.display = 'block';
                video.style.display = 'none';
                placeholder.style.display = 'none';
                currentMedia = audio;
            }

            const playBtn = windowEl.querySelector('.play');
            playBtn.textContent = '▶️';
        }

        function toggleMediaPlay() {
            if (!currentMedia) return;

            const windowEl = currentMedia.closest('.window');
            const playBtn = windowEl.querySelector('.play');

            if (currentMedia.paused) {
                currentMedia.play();
                playBtn.textContent = '⏸️';
            } else {
                currentMedia.pause();
                playBtn.textContent = '▶️';
            }
        }

        function stopMedia() {
            if (!currentMedia) return;

            currentMedia.pause();
            currentMedia.currentTime = 0;
            const windowEl = currentMedia.closest('.window');
            const playBtn = windowEl.querySelector('.play');
            playBtn.textContent = '▶️';
        }

        function mediaSeek(seconds) {
            if (!currentMedia) return;
            currentMedia.currentTime += seconds;
        }

        function seekMedia(event) {
            if (!currentMedia) return;

            const windowEl = event.target.closest('.window');
            const progress = windowEl.querySelector('#player-progress');
            const rect = progress.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            currentMedia.currentTime = percent * currentMedia.duration;
        }

        function setMediaVolume(value) {
            if (!currentMedia) return;
            currentMedia.volume = value;
        }

        // ==================== CLOCK ====================
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('clock').innerHTML = `<div>${time}</div><div style="font-size:9px;">${date}</div>`;
        }

        // ==================== INITIALIZATION ====================
        const windowManager = new WindowManager();
        const deskbar = new Deskbar();
        const desktop = new Desktop();

        setInterval(updateClock, 1000);
        updateClock();

        // Open File Browser by default
        setTimeout(() => {
            const windowData = windowManager.createWindow('file-browser');
            if (windowData) {
                deskbar.addTask(windowData.id, 'file-browser');
            }
        }, 500);
    </script>
